  DGM4: ../data/sources/DGM4
  MEIR: ../data/sources/MEIR
  MMFakeBench: ../data/sources/MMFakeBench
  NewsCLIPpings: ../data/sources/NewsCLIPpings
  VERITE: ../data/sources/VERITE

single_modality_pools:
  images: ../data/pools/images.jsonl
  texts: ../data/pools/texts.jsonl

output_root: ../release
